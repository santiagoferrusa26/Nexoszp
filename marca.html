<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marca - Nexos ZP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .imagen-marca {
            height: 180px;
            object-fit: contain;
            padding: 15px;
        }

        .card {
            height: 100%;
        }
    </style>


</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Nexos ZP</a>
    </div>
</nav>


<div class="container mt-5">

    <div class="row justify-content-center g-4">


        <div class="col-md-3 d-flex">
            <div class="card w-100 text-center">
                <img src="imagenes/logo_adidas.png" class="card-img-top imagen-marca" alt="Adidas">

                <div class="card-body">
                    <h5 class="card-title">Adidas</h5>
                    <p class="card-text">Una de las mejores marcas de zapatillas.</p>
                    <a href="https://www.adidas.com.ar/originals" class="btn btn-primary">Ver</a>
                </div>
            </div>
        </div>

        <div class="col-md-3 d-flex">
            <div class="card w-100 text-center">
                <img src="imagenes/nike2.png" class="card-img-top imagen-marca" alt="Nike">

                <div class="card-body">
                    <h5 class="card-title">Nike</h5>
                    <p class="card-text">Una de las mejores marcas de zapatillas.</p>
                    <a href="https://www.nike.com.ar/" class="btn btn-primary">Ver</a>
                </div>
            </div>
        </div>

        <div class="col-md-3 d-flex">
            <div class="card w-100 text-center">
                <img src="imagenes/logo_puma.png" class="card-img-top imagen-marca" alt="Puma">

                <div class="card-body">
                    <h5 class="card-title">Puma</h5>
                    <p class="card-text">Una de las marcas más reconocidas de zapatillas.</p>
                    <a href="https://ar.puma.com/" class="btn btn-primary">Ver</a>
                </div>
            </div>
        </div>

        <div class="col-md-3 d-flex">
            <div class="card w-100 text-center">
                <img src="imagenes/vans_logo.png" class="card-img-top imagen-marca" alt="Vans">

                <div class="card-body">
                    <h5 class="card-title">Vans</h5>
                    <p class="card-text">Marca reconocida por sus zapatillas urbanas y de skate.</p>
                    <a href="https://www.vans.com.ar/" class="btn btn-primary">Ver</a>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-4">
        <a href="index.html" class="btn btn-primary">
            Volver al inicio
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
